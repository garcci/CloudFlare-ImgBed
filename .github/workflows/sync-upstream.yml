name: Upstream Sync

permissions:
  contents: write
  actions: write
  issues: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
    inputs:
      confirm_breaking_update:
        description: "I have reviewed any compatibility update notice and agree to apply it if present / 我已阅读可能存在的兼容性更新公告，并同意在有此类更新时应用"
        required: true
        default: false
        type: boolean

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check breaking update policy
        id: breaking_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_REPO: MarSeventh/CloudFlare-ImgBed
          UPSTREAM_BRANCH: main
          ALLOW_BREAKING_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_breaking_update == true }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh check

      - name: Sync upstream changes
        id: sync
        if: steps.breaking_guard.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail

          # The breaking-update guard has already fetched this upstream ref.
          upstream_ref="refs/remotes/cloudflare-imgbed-upstream/main"
          notice_title="[Upstream Sync] Manual Sync fork required"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "manual_required=false" >> "$GITHUB_OUTPUT"

          find_notice() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
              --json number,title \
              --jq '.[] | select(.title == "[Upstream Sync] Manual Sync fork required") | .number' | head -n 1
          }

          close_notice() {
            local number
            number="$(find_notice || true)"
            if [[ -n "$number" ]]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
                --body "Upstream is integrated into main; this manual-sync notice is resolved." >/dev/null || true
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed >/dev/null || true
            fi
          }

          before="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          upstream="$(git rev-parse "$upstream_ref")"
          git fetch --quiet origin main

          # A fork-specific fix may make main ahead of upstream; that is not a reason to sync.
          if git merge-base --is-ancestor "$upstream" "$before"; then
            echo "Already contains the latest upstream commit."
            echo "## ✅ Upstream already integrated" >> "$GITHUB_STEP_SUMMARY"
            close_notice
            exit 0
          fi

          base="$(git merge-base "$before" "$upstream")"
          workflow_changes="$(git diff --name-only "$base" "$upstream" -- '.github/workflows/')"
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT

          # GitHub's native fork-sync endpoint needs only contents:write.
          # If it rejects workflow changes, do not request or use a privileged token.
          if ! gh api --method POST "repos/$GITHUB_REPOSITORY/merge-upstream" \
              -f branch=main >/dev/null 2>"$error_file"; then
            if grep -Eiq 'HTTP (403|409|422)|workflows? permission' "$error_file"; then
              number="$(find_notice || true)"
              if [[ -z "$number" ]]; then
                body="$(printf 'Native fork synchronization requires manual review (permission or merge conflict).\n\nFork HEAD before attempt: %s\nUpstream HEAD: %s\nUpstream workflow changes:\n%s\n\nReview the changes and use **Sync fork → Update branch** on https://github.com/%s . Do not create a high-permission token. Automatic checks will continue, and this issue will be closed after the upstream commit is integrated.\n' "$before" "$upstream" "$workflow_changes" "$GITHUB_REPOSITORY")"
                gh issue create --repo "$GITHUB_REPOSITORY" \
                  --title "$notice_title" --body "$body" >/dev/null
              fi
              echo "manual_required=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Native upstream sync needs manual review. See the open Upstream Sync issue."
              {
                echo "## ⚠️ Upstream sync needs manual review"
                echo
                echo "GitHub rejected the native sync or found a merge conflict. No privileged token was requested."
                echo "Use **Sync fork → Update branch** after reviewing upstream changes."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Native GitHub fork sync API failed unexpectedly."
            cat "$error_file" >&2
            exit 1
          fi

          after="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$upstream" "$after"; then
            echo "::error::Sync response succeeded but the upstream commit is not in main."
            exit 1
          fi

          if [[ "$after" != "$before" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          close_notice
          {
            echo "## ✅ GitHub native upstream sync completed"
            echo
            echo "Before: \`$before\`"
            echo "After: \`$after\`"
            echo "Upstream integrated: \`$upstream\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Complete breaking update notices
        if: steps.sync.outcome == 'success' && steps.sync.outputs.manual_required != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/breaking-updates/scripts/breaking-update-guard.sh complete

      - name: Trigger Worker deploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Sync failure guidance
        if: failure() && steps.sync.outcome == 'failure'
        run: |
          {
            echo "## ⚠️ 上游同步未完成 / Upstream synchronization did not complete"
            echo
            echo "上游同步步骤未能完成。若上游近期修改了 workflow 文件，GitHub 可能会暂停包含 workflow 变更的自动同步；也可能是当前 Fork 的 Actions 权限或同步权限发生了变化。"
            echo
            echo "The upstream synchronization step could not be completed. If the upstream workflow files changed recently, GitHub may pause automatic synchronization that includes workflow changes. The issue may also be related to Actions or synchronization permissions in this fork."
            echo
            echo "建议先在 GitHub 页面手动执行一次 **Sync fork**，确认 Actions 具有读写权限后，再重新运行本工作流。"
            echo
            echo "Please manually use **Sync fork** on GitHub, confirm that Actions has read and write permissions, and then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "[Error] 上游同步未能完成。若上游近期修改了 workflow 文件，请先在 GitHub 页面手动执行一次 Sync Fork，然后重新运行本工作流。"
          echo "[Error] The upstream sync could not be completed. If the upstream workflow files changed recently, manually run Sync Fork on GitHub and then rerun this workflow."
          exit 1
